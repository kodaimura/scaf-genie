services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - julia_depot:/root/.julia
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      - APP_ENV=dev
      - GENIE_ENV=dev
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
      - AUTH_LOGIN_ID_MODE=${AUTH_LOGIN_ID_MODE:-email}
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:-randomstring}
      - ACCESS_TOKEN_EXPIRES_SECONDS=${ACCESS_TOKEN_EXPIRES_SECONDS:-900}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-randomstring}
      - REFRESH_TOKEN_EXPIRES_SECONDS=${REFRESH_TOKEN_EXPIRES_SECONDS:-43200}
      - REFRESH_TOKEN_REMEMBER_ME_EXPIRES_SECONDS=${REFRESH_TOKEN_REMEMBER_ME_EXPIRES_SECONDS:-2592000}
      - PASSWORD_RESET_URL_BASE=${PASSWORD_RESET_URL_BASE:-http://localhost:3000/reset-password}
      - PASSWORD_RESET_TOKEN_EXPIRES_MINUTES=${PASSWORD_RESET_TOKEN_EXPIRES_MINUTES:-30}
      - PASSWORD_RESET_RESEND_INTERVAL_MINUTES=${PASSWORD_RESET_RESEND_INTERVAL_MINUTES:-5}
      - MAIL_PROVIDER=${MAIL_PROVIDER:-mailhog}
      - MAIL_FROM=${MAIL_FROM:-no-reply@example.local}
      - SMTP_HOST=${SMTP_HOST:-mailhog}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-false}
    working_dir: /app
    command: [ "./entrypoint.sh" ]
    tty: true

  db:
    image: postgres:17.4
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-project_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - TZ=UTC
      - PGTZ=UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    ports:
      - "${MAILHOG_PORT:-8025}:8025"

volumes:
  db_data:
  julia_depot:
