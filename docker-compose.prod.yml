services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - GENIE_ENV=${GENIE_ENV:-prod}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test:
        [
          "CMD",
          "julia",
          "--project=.",
          "-e",
          "using HTTP; HTTP.get(\"http://127.0.0.1:8000/health\"; status_exception=true)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    working_dir: /app
    command: [ "./entrypoint.sh" ]
    tty: true
